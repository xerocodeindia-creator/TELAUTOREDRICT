<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Continue to the Grow with Aarohi Telegram bot.">
  <title>Redirecting to Telegram</title>
  <script>
    (function () {
      var destination = 'https://t.me/Growithaarohibot';
      var redirected = false;
      function goToTelegram() {
        if (redirected) return;
        redirected = true;
        window.location.replace(destination);
      }

      // Fallback in case the Pixel is blocked or its callback never fires.
      var fallbackTimer = window.setTimeout(goToTelegram, 300);

      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');

      fbq('init', '1360885335597921');
      fbq('track', 'PageView');
      fbq('trackCustom', 'TelegramRedirect', {}, {
        eventCallback: function () {
          window.clearTimeout(fallbackTimer);
          goToTelegram();
        },
        eventTimeout: 1000
      });
    })();
  </script>
</head>
<body>
  <p>Redirecting to Telegram…</p>
  <p><a href="https://t.me/Growithaarohibot">Continue to Grow with Aarohi on Telegram</a></p>
  <noscript>
    <meta http-equiv="refresh" content="0;url=https://t.me/Growithaarohibot">
    <p>JavaScript is disabled. <a href="https://t.me/Growithaarohibot">Open Telegram</a>.</p>
  </noscript>
</body>
</html>
